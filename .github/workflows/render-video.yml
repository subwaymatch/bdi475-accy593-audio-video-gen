name: Render video

# Renders the HyperFrames composition in video/ to MP4 in 1080p and 4K.
# - Pull requests: render 1080p only (a quick check) and upload it as a workflow artifact.
# - Pushes to main / manual runs: render 1080p and 4K in parallel and publish both, plus the
#   song, as one GitHub Release.
# - Manual runs can also re-run the ElevenLabs lyric alignment of the song
#   (needs the ELEVENLABS_API_KEY repository secret).

on:
  push:
    branches: [main]
    paths:
      - "video/**"
      - "song/**"
      - "scripts/**"
      - ".github/workflows/render-video.yml"
  pull_request:
    paths:
      - "video/**"
      - "song/**"
      - "scripts/**"
      - ".github/workflows/render-video.yml"
  workflow_dispatch:
    inputs:
      regenerate_audio:
        description: "Re-run ElevenLabs lyric alignment (uses credits; needs ELEVENLABS_API_KEY secret)"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (default: video-<date>-<sha>)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  HYPERFRAMES_VERSION: 0.9.47
  HYPERFRAMES_SKIP_SKILLS: "1"
  BASENAME: good-luck-everyone

jobs:
  # Builds the caption timeline once, so every resolution renders the exact same composition.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Re-align lyrics (ElevenLabs)
        if: github.event_name == 'workflow_dispatch' && inputs.regenerate_audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::Set the ELEVENLABS_API_KEY repository secret to regenerate audio."
            exit 1
          fi
          node scripts/generate-audio.mjs
          pip install -q fonttools brotli
          python3 scripts/fonts.py

      - name: Build caption timeline
        run: node scripts/build-timeline.mjs

      - name: Lint composition
        working-directory: video
        run: |
          npx --yes hyperframes@${HYPERFRAMES_VERSION} telemetry disable || true
          npx --yes hyperframes@${HYPERFRAMES_VERSION} lint

      - name: Upload composition
        uses: actions/upload-artifact@v4
        with:
          name: composition
          path: video/
          include-hidden-files: false
          if-no-files-found: error

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Pull requests render 1080p only; releases render 1080p and 4K in parallel.
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"name":"1080p","args":""}]'
          || '[{"name":"1080p","args":""},{"name":"4k","args":"--resolution 4k"}]') }}
    name: render (${{ matrix.name }})
    steps:
      - name: Download composition
        uses: actions/download-artifact@v4
        with:
          name: composition
          path: video

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install headless Chrome for HyperFrames
        run: |
          npx --yes hyperframes@${HYPERFRAMES_VERSION} telemetry disable || true
          line=$(npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/browsers" | tail -1)
          bin="${line#* }"
          if [ -x "$bin" ]; then
            echo "HYPERFRAMES_BROWSER_PATH=$bin" >> "$GITHUB_ENV"
            echo "Using $bin"
          else
            echo "chrome-headless-shell not found, falling back to system Chrome"
          fi

      - name: Render MP4 (${{ matrix.name }})
        working-directory: video
        run: |
          out="../out/${BASENAME}-${{ matrix.name }}.mp4"
          mkdir -p ../out
          # --resolution 4k renders the same 1920x1080 composition at 2x device pixel ratio,
          # so text and shapes are drawn natively at 3840x2160 (not upscaled).
          npx --yes hyperframes@${HYPERFRAMES_VERSION} render ${{ matrix.args }} -o "$out" --workers 4
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height -of compact "$out"

      - name: Upload ${{ matrix.name }} MP4
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASENAME }}-${{ matrix.name }}
          path: out/${{ env.BASENAME }}-${{ matrix.name }}.mp4
          compression-level: 0
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download renders
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BASENAME }}-*
          path: out
          merge-multiple: true

      - name: Download composition (for the song file)
        uses: actions/download-artifact@v4
        with:
          name: composition
          path: composition

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          ls -la out
          tag="${INPUT_TAG:-video-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}}"
          {
            echo "**Downloads:** \`${BASENAME}-4k.mp4\` (3840×2160) · \`${BASENAME}-1080p.mp4\` (1920×1080) · \`song.mp3\`"
            echo
            node scripts/release-notes.mjs
          } > "$RUNNER_TEMP/notes.md"
          cp composition/assets/song.mp3 out/song.mp3
          gh release create "$tag" out/${BASENAME}-4k.mp4 out/${BASENAME}-1080p.mp4 out/song.mp3 \
            --target "$GITHUB_SHA" \
            --title "Good Luck, Everyone! — BDI 475 · ACCY 593 ($tag)" \
            --notes-file "$RUNNER_TEMP/notes.md"
